name: Daiku Interior CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: daiku_interior_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, redis, bcmath, gd, zip, intl
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: daiku_interior_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run Pest test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: daiku_interior_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          XDEBUG_MODE: "off" # coverage is collected in the next step
        run: php artisan test

      # PRD §10.3 targets >=70% coverage. Informational for now: prints the
      # per-file table + total and never fails the build. Once the first
      # number is known, make it a gate: add `--min=70` and remove
      # `continue-on-error` (README "Testing").
      - name: Coverage report (informational)
        continue-on-error: true
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: daiku_interior_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          XDEBUG_MODE: coverage
        run: |
          php artisan test --coverage --compact | tee coverage.txt
          total="$(sed 's/\x1b\[[0-9;]*m//g' coverage.txt | grep -Eo 'Total: *[0-9.]+ ?%' | tail -n1 || true)"
          echo "### Test coverage: ${total:-n/a} (target PRD §10.3: 70%)" >> "$GITHUB_STEP_SUMMARY"

  # Auto deploy (PRD §3.3, git flow §10.1): develop → staging, main →
  # production, only after `test` passed on a push. The remote side is
  # deploy/deploy.sh. Without the secrets the job is skipped with a notice.
  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Check deploy secrets
        id: config
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy staging dilewati::Isi secrets STAGING_HOST, STAGING_USER, STAGING_SSH_KEY dan STAGING_PATH untuk mengaktifkan auto deploy."
          fi

      - name: Deploy to staging over SSH
        if: steps.config.outputs.ready == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
          DEPLOY_BRANCH: develop
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
          command_timeout: 30m
          envs: DEPLOY_PATH,DEPLOY_BRANCH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            bash deploy/deploy.sh "$DEPLOY_BRANCH"

  deploy-production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deploy secrets
        id: config
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy production dilewati::Isi secrets PRODUCTION_HOST, PRODUCTION_USER, PRODUCTION_SSH_KEY dan PRODUCTION_PATH untuk mengaktifkan auto deploy."
          fi

      - name: Deploy to production over SSH
        if: steps.config.outputs.ready == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.PRODUCTION_PATH }}
          DEPLOY_BRANCH: main
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          fingerprint: ${{ secrets.PRODUCTION_SSH_FINGERPRINT }}
          command_timeout: 30m
          envs: DEPLOY_PATH,DEPLOY_BRANCH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            bash deploy/deploy.sh "$DEPLOY_BRANCH"
