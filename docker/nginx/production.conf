# Production/staging vhost — HTTPS via Let's Encrypt (PRD §9.5).
#
# Used by docker-compose.prod.yml as an nginx *template*: the official image
# renders /etc/nginx/templates/*.template with envsubst at container start,
# substituting only variables that exist in the environment. The single one
# used here, ${NGINX_SERVER_NAME}, comes from APP_DOMAIN in .env; every other
# $variable below is nginx's own and is left untouched.
#
# The certificate must exist before this config can load — first-time
# issuance and renewal are described in README "HTTPS / Produksi".
#
# Upstreams are resolved per request through Docker's DNS (resolver +
# variables), so recreating the app/soketi containers on deploy never leaves
# nginx pointing at a stale container IP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Port 80: ACME challenges only, everything else → HTTPS --------------
server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://${NGINX_SERVER_NAME}$request_uri;
    }
}

# --- Port 443: the application -------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name ${NGINX_SERVER_NAME};
    server_tokens off;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem;

    # Mozilla "intermediate" profile. No OCSP stapling: Let's Encrypt no
    # longer runs OCSP responders.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:DaikuSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers. They are inherited by every location below only as
    # long as no location declares its own add_header — use `expires` there.
    # HSTS without includeSubDomains/preload: other daikuinterior.com
    # subdomains are not ours to force onto HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Largest upload is the 5 MB login image (UploadBrandingAssetRequest);
    # keep in sync with upload_max_filesize/post_max_size in the Dockerfile.
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Laravel Echo → Soketi (Pusher protocol): wss://<domain>/app/<key>.
    # Soketi publishes no port in production; only this WebSocket path is
    # reachable from outside. Its HTTP API (/apps/...) stays internal —
    # Laravel talks to it directly at soketi:6001 (PUSHER_HOST=soketi).
    location /app/ {
        set $soketi_upstream soketi:6001;
        proxy_pass http://$soketi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite output: content-hashed file names, safe to cache forever.
    location /build/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    # Only the front controller is executed; the script path is resolved
    # inside the app container (same /var/www/html/public layout).
    location ~ ^/index\.php(/|$) {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
