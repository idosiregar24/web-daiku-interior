version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: daiku-interior-app
    container_name: daiku_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      - mysql
      - redis
    networks:
      - daiku

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: daiku-interior-app
    container_name: daiku_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - daiku

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: daiku-interior-app
    container_name: daiku_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - daiku

  mysql:
    image: mysql:8.0
    container_name: daiku_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-daiku_interior}
      MYSQL_USER: ${DB_USERNAME:-daiku}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - daiku_mysql_data:/var/lib/mysql
    ports:
      - '3307:3306'
    networks:
      - daiku

  redis:
    image: redis:7-alpine
    container_name: daiku_redis
    restart: unless-stopped
    volumes:
      - daiku_redis_data:/data
    networks:
      - daiku

  # Laravel Reverb (Sprint 18, replaces Soketi) — same image as the app,
  # reads REVERB_* from .env. Browsers connect on :8080 in dev.
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    image: daiku-interior-app
    container_name: daiku_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./:/var/www/html
    ports:
      - '8080:8080'
    networks:
      - daiku

  nginx:
    image: nginx:stable-alpine
    container_name: daiku_nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - daiku

networks:
  daiku:
    driver: bridge

volumes:
  daiku_mysql_data:
  daiku_redis_data:
